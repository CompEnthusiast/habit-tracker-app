<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="streakGrad" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="shadow" x="50" y="50" width="412" height="412" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#818cf8" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Glowing Ring -->
  <circle cx="256" cy="256" r="160" stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round" stroke-dasharray="720 180" opacity="0.85" filter="url(#shadow)" />

  <!-- Inner Sparkle / Flame streak + Checkmark -->
  <path d="M190 265 L235 310 L330 205" stroke="url(#streakGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Top Right Sparkle -->
  <circle cx="370" cy="140" r="14" fill="#38bdf8" />
  <path d="M370 110 V170 M340 140 H400" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
</svg>